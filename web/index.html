<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blind Auction 시연</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!-- "ethers" in the browser modules = the backend's own copy, served by the API (design.md 17번). -->
    <script type="importmap">
      { "imports": { "ethers": "/vendor/ethers.min.js" } }
    </script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">Blind Auction</a>
      <span class="tag">시연용 화면 · 로컬 Hardhat 노드</span>
      <form id="search" class="search" autocomplete="off">
        <input id="search-input" type="text" placeholder="참여한 경매 찾기: 지갑 주소 0x…" spellcheck="false" />
        <button type="submit">찾기</button>
      </form>
      <div id="asof" class="asof" aria-live="polite">불러오는 중…</div>
    </header>
    <main id="main"></main>
    <footer class="foot">
      진행 상태는 서버 시계가 아니라 Indexer가 마지막으로 읽은 블록의 시간으로 계산합니다 (3초마다 새로고침).
    </footer>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
